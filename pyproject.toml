[project]
name = "hloc"
version = "1.5.1"
requires-python = ">=3.10"
description = "Tools and baselines for visual localization and mapping."
authors = [{ name = "Paul-Edouard Sarlin" }]
readme = "README.md"
license-files = ["LICENSE"]
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
urls = { git = 'https://github.com/cvg/Hierarchical-Localization' }
dependencies = [
  "kornia>=0.6.11",
  "numpy>=2.0.2",
  "scipy>=1.13.1",
  "tqdm>=4.67.3",
  "opencv-python>=4.13.0.92",
  "matplotlib>=3.9.4",
  "plotly>=6.5.2",
  "h5py>=3.14.0",
  "gdown>=5.2.1",
  "torch>=1.4.0",
  "torchvision>=0.6.0",
  "pycolmap (>=3.13.0,<4.0.0)",
  "lightglue",
  "safetensors>=0.7.0",
]

[dependency-groups]
dev = [
  "mypy>=1.19.1",
  "ruff>=0.15.5",
]

[tool.uv]
conflicts = [
  [{ extra = "cpu" }, { extra = "cuda" }],
]

[tool.uv.sources]
lightglue = { git = "https://github.com/cvg/LightGlue" }

[tool.hatch.build.targets.wheel]
packages = ["hloc"]
include = ["hloc/**/*.py"]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", "__pycache__", "build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
plugins = ["numpy.typing.mypy_plugin"]
disallow_any_generics = true
strict_optional = true
check_untyped_defs = true
allow_redefinition = true
